name: CI/CD 자동 배포

# main 브랜치에 push될 때만 실행
on:
  push:
    branches: [ main, develop ]

jobs:
  # ── Job 1: 빌드 & Docker 이미지 push ──────────────────────────
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 캐시 복원
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Gradle 빌드 및 테스트
        run: ./gradlew build --no-daemon

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker 이미지 빌드 및 GHCR Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/critical-flow-backend:latest
            ghcr.io/${{ github.repository_owner }}/critical-flow-backend:sha-${{ github.sha }}

  # ── Job 2: EC2 배포 (Job 1 성공 후 실행) ──────────────────────
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: EC2 SSH 접속 및 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/critical-flow

            # GitHub Secrets 값으로 .env 파일 갱신
            cat > .env << 'ENVEOF'
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}
            DB_ROOT_PASSWORD=${{ secrets.DB_ROOT_PASSWORD }}
            DB_URL=jdbc:mysql://db:3306/criticalflow?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            JWT_EXPIRATION=3600000
            JWT_REFRESH_EXPIRATION=1209600000
            OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
            GITHUB_CLIENT_ID=${{ secrets.GH_CLIENT_ID }}
            GITHUB_CLIENT_SECRET=${{ secrets.GH_CLIENT_SECRET }}
            CHROMA_HOST=http://chroma
            CHROMA_PORT=8000
            FRONTEND_CALLBACK_URL=${{ secrets.FRONTEND_CALLBACK_URL }}
            ENVEOF

            # GHCR 로그인
            echo ${{ secrets.GITHUB_TOKEN }} | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # 최신 app 이미지만 pull
            docker compose pull app

            # 컨테이너 재시작 (볼륨 유지, 데이터 초기화 없음)
            docker compose up -d

            # 오래된 이미지 정리
            docker image prune -f

      - name: 배포 헬스체크
        run: |
          sleep 30
          curl -f https://${{ secrets.DOMAIN }}/health || exit 1
