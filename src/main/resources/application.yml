server:
  port: 8080
  forward-headers-strategy: FRAMEWORK

spring:
  application:
    name: criticalflow

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GH_CLIENT_ID}
            client-secret: ${GH_CLIENT_SECRET}
            scope:
              - read:user
              - user:email

  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/criticalflow?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:0000}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false

  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      embedding:
        options:
          model: text-embedding-3-small
      chat:
        options:
          model: gpt-4o
          temperature: 0.3

    vectorstore:
      chroma:
        client:
          host: ${CHROMA_HOST:http://localhost}
          port: ${CHROMA_PORT:8000}
        tenant-name: ${CHROMA_TENANT:default_tenant}
        database-name: ${CHROMA_DATABASE:default_database}
        collection-name: criticalflow-notes
        initialize-schema: true

rag:
  similarity-threshold: 0.55  # [#60 측정 중] 1차 측정 완료 후 0.55로 변경
  max-results: 4
  focus-lookback-minutes: 15
  bm25-max-results: 10

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:1209600000}

frontend:
  callback-url: ${FRONTEND_CALLBACK_URL:http://localhost:5173/oauth/callback}
