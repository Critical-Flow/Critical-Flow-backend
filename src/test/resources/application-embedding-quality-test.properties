# ── DataSource (H2, integration-test와 동일) ────────────────────────────────
spring.datasource.url=jdbc:h2:mem:quality-test;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ── OAuth2 (더미) ─────────────────────────────────────────────────────────────
spring.security.oauth2.client.registration.github.client-id=test
spring.security.oauth2.client.registration.github.client-secret=test
spring.security.oauth2.client.registration.github.scope=read:user
spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute=login

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=quality-test-secret-must-be-32chars-ok
jwt.expiration=86400000

# ── OpenAI — 실제 API 키 사용 (MockEmbeddingModel 없음) ───────────────────────
spring.ai.openai.api-key=${OPENAI_API_KEY}

# ── ChromaDB (Testcontainers가 host/port를 DynamicPropertySource로 주입) ────
spring.ai.vectorstore.chroma.collection-name=quality-test-criticalflow
spring.ai.vectorstore.chroma.initialize-schema=true

# ── Misc ──────────────────────────────────────────────────────────────────────
frontend.callback-url=http://localhost:5173
