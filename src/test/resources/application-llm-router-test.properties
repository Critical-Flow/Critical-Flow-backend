# ── DataSource (H2) ──────────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:llm-router-test;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=USER,VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# ── OAuth2 (더미) ─────────────────────────────────────────────────────────────
spring.security.oauth2.client.registration.github.client-id=test
spring.security.oauth2.client.registration.github.client-secret=test
spring.security.oauth2.client.registration.github.scope=read:user
spring.security.oauth2.client.provider.github.authorization-uri=https://github.com/login/oauth/authorize
spring.security.oauth2.client.provider.github.token-uri=https://github.com/login/oauth/access_token
spring.security.oauth2.client.provider.github.user-info-uri=https://api.github.com/user
spring.security.oauth2.client.provider.github.user-name-attribute=login

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=llm-router-test-secret-must-be-32chars!
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ── OpenAI (실제 API — LLM 분류 테스트 필요) ─────────────────────────────────
spring.ai.openai.api-key=${OPENAI_API_KEY:test-key}
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.chat.options.temperature=0.3
spring.ai.openai.embedding.options.model=text-embedding-3-small

# ── ChromaDB (더미 — RAG 검색 불필요) ────────────────────────────────────────
spring.ai.vectorstore.chroma.client.host=http://localhost
spring.ai.vectorstore.chroma.client.port=8000
spring.ai.vectorstore.chroma.initialize-schema=false
spring.ai.vectorstore.chroma.collection-name=criticalflow-notes
spring.ai.vectorstore.chroma.tenant-name=default_tenant
spring.ai.vectorstore.chroma.database-name=default_database

# ── RAG 설정 ─────────────────────────────────────────────────────────────────
rag.similarity-threshold=0.55
rag.max-results=4
rag.bm25-max-results=10
rag.dense-disabled=false
rag.focus-lookback-minutes=15

# ── Python Vision ─────────────────────────────────────────────────────────────
python.vision.url=http://localhost:5000

# ── Frontend ─────────────────────────────────────────────────────────────────
frontend.callback-url=http://localhost:5173/oauth/callback
