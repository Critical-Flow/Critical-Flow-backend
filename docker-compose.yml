services:

  # ── Nginx: 외부 요청 진입점, HTTPS 처리 ──────────────────────
  nginx:
    image: nginx:alpine
    container_name: criticalflow-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
    depends_on:
      - app
    restart: always
    networks:
      - criticalflow-net

  # ── Spring Boot 앱 ──────────────────────────────────────────
  app:
    image: ghcr.io/critical-flow/critical-flow-backend:latest
    container_name: criticalflow-app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      chroma:
        condition: service_started
    restart: always
    networks:
      - criticalflow-net

  # ── MySQL 데이터베이스 ────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: criticalflow-db
    environment:
      MYSQL_DATABASE: criticalflow
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - criticalflow-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    networks:
      - criticalflow-net

  # ── ChromaDB 벡터 스토어 ──────────────────────────────────────
  chroma:
    image: chromadb/chroma:0.5.23
    platform: linux/amd64
    container_name: criticalflow-chroma
    volumes:
      - criticalflow-chroma-data:/chroma/chroma
    restart: always
    networks:
      - criticalflow-net

# ── 볼륨 (데이터 영속성) ─────────────────────────────────────────
volumes:
  criticalflow-mysql-data:    # MySQL 데이터 (컨테이너와 독립적으로 유지)
  criticalflow-chroma-data:   # ChromaDB 데이터 (컨테이너와 독립적으로 유지)
  certbot-etc:                # SSL 인증서 저장

# ── 네트워크 ─────────────────────────────────────────────────────
networks:
  criticalflow-net:
    driver: bridge
